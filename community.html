<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community — Subjects Online</title>
    <meta name="description" content="Connect with your fellow students — ask questions, share files, and chat in real-time on Subjects Online Community.">

    <!-- Page Transition -->
    <script src="js/page-transition.js"></script>

    <link rel="stylesheet" href="css/tailwind-utilities.css">
    

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Community CSS -->
    <link rel="stylesheet" href="css/community.css">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/mobile-perf.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="apple-touch-icon" href="images/icon-512.png">
</head>

<body class="comm-body overflow-x-hidden min-h-screen flex flex-col justify-center items-center relative selection:bg-red-500/30 selection:text-white">

    <!-- Shared Nav injected by JS -->

    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="comm-bg" aria-hidden="true">
        <div class="comm-orb comm-orb-1"></div>
        <div class="comm-orb comm-orb-2"></div>
        <div class="comm-orb comm-orb-3"></div>
        <div class="comm-grid-overlay"></div>
    </div>

    <!-- ===== LOCKED CONTENT SCREEN ===== -->
    <main class="locked-screen-wrap">
        <div class="locked-card" id="locked-card-box">
            <!-- Floating Particles -->
            <div class="lock-particles" aria-hidden="true">
                <div class="lock-particle" style="width: 6px; height: 6px; top: 20%; left: 15%; animation-delay: 0s;"></div>
                <div class="lock-particle" style="width: 10px; height: 10px; top: 65%; left: 80%; animation-delay: -2s; background: rgba(239,68,68,0.4);"></div>
                <div class="lock-particle" style="width: 8px; height: 8px; top: 75%; left: 25%; animation-delay: -4s;"></div>
                <div class="lock-particle" style="width: 12px; height: 12px; top: 15%; left: 75%; animation-delay: -1s; background: rgba(168,85,247,0.4);"></div>
            </div>

            <div class="locked-card-content">
                <!-- Status Pill Badge -->
                <div class="locked-badge">
                    <span class="locked-badge-dot"></span>
                    <span>Restricted Access</span>
                </div>

                <!-- Lock Stage Animation -->
                <div class="lock-stage" id="lock-stage">
                    <div class="lock-shockwave" id="lock-shockwave"></div>

                    <!-- Animated Key -->
                    <div class="lock-key-anim" id="lock-key-el">
                        <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 24C18 28.4183 14.4183 32 10 32C5.58172 32 2 28.4183 2 24C2 19.5817 5.58172 16 10 16C14.4183 16 18 19.5817 18 24Z" fill="url(#key_grad_1)" stroke="#F59E0B" stroke-width="2.5"/>
                            <path d="M16 24H44M36 24V30M42 24V28" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="10" cy="24" r="3.5" fill="#FFF"/>
                            <defs>
                                <linearGradient id="key_grad_1" x1="2" y1="16" x2="18" y2="32" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#FBBF24"/>
                                    <stop offset="1" stop-color="#D97706"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <!-- Padlock SVG -->
                    <div class="padlock-box">
                        <svg width="110" height="130" viewBox="0 0 110 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Shackle (Arch) -->
                            <g class="padlock-shackle" id="padlock-shackle">
                                <path d="M30 54V32C30 18.1929 41.1929 7 55 7C68.8071 7 80 18.1929 80 32V54" 
                                      stroke="url(#shackle_grad)" stroke-width="12" stroke-linecap="round"/>
                                <path d="M30 54V32C30 18.1929 41.1929 7 55 7C68.8071 7 80 18.1929 80 32V54" 
                                      stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 80"/>
                            </g>

                            <!-- Lock Body -->
                            <rect x="12" y="48" width="86" height="74" rx="22" fill="url(#body_grad)" stroke="url(#body_stroke)" stroke-width="3"/>
                            
                            <!-- Body Metallic Shine -->
                            <path d="M22 56C22 53.7909 23.7909 52 26 52H84C86.2091 52 88 53.7909 88 56V62C88 64.2091 86.2091 66 84 66H26C23.7909 66 22 64.2091 22 62V56Z" fill="url(#shine_grad)" opacity="0.6"/>
                            
                            <!-- Keyhole Outer Circle -->
                            <circle cx="55" cy="80" r="11" fill="#0F172A" stroke="url(#keyhole_stroke)" stroke-width="2"/>
                            <!-- Keyhole Slot -->
                            <path d="M55 74C52.2386 74 50 76.2386 50 79C50 80.8906 51.047 82.5365 52.5938 83.3906L51 92H59L57.4062 83.3906C58.953 82.5365 60 80.8906 60 79C60 76.2386 57.7614 74 55 74Z" fill="#38BDF8" id="keyhole-slot"/>

                            <!-- Gradients -->
                            <defs>
                                <linearGradient id="shackle_grad" x1="30" y1="7" x2="80" y2="54" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#94A3B8"/>
                                    <stop offset="0.5" stop-color="#F8FAFC"/>
                                    <stop offset="1" stop-color="#64748B"/>
                                </linearGradient>
                                <linearGradient id="body_grad" x1="12" y1="48" x2="98" y2="122" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#0EA5E9"/>
                                    <stop offset="0.5" stop-color="#0284C7"/>
                                    <stop offset="1" stop-color="#0F172A"/>
                                </linearGradient>
                                <linearGradient id="body_stroke" x1="12" y1="48" x2="98" y2="122" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#38BDF8"/>
                                    <stop offset="1" stop-color="#1E293B"/>
                                </linearGradient>
                                <linearGradient id="shine_grad" x1="22" y1="52" x2="88" y2="66" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="white" stop-opacity="0.8"/>
                                    <stop offset="1" stop-color="white" stop-opacity="0"/>
                                </linearGradient>
                                <linearGradient id="keyhole_stroke" x1="44" y1="69" x2="66" y2="91" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#38BDF8"/>
                                    <stop offset="1" stop-color="#0EA5E9"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>

                <!-- Text Header -->
                <h1 class="locked-title">
                    THIS CONTENT IS <span>LOCKED</span>
                </h1>

                <p class="locked-desc">
                    This section is strictly restricted and currently locked.
                </p>

                <!-- Action Button -->
                <a href="dashboard.html" class="locked-btn-primary" id="return-dash-btn">
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    <span>Return to Dashboard</span>
                </a>
            </div>
        </div>
    </main>

    <!-- ===== SCRIPTS ===== -->
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- App scripts -->
    <script src="js/shared-nav.js?v=3"></script>

    <!-- Key & Lock Animation Sequence Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lockStage = document.getElementById('lock-stage');
            const keyEl = document.getElementById('lock-key-el');
            const keyholeSlot = document.getElementById('keyhole-slot');

            if (!lockStage || !keyEl) return;

            // GSAP Sequence: Key inserts, turns 90deg, lock snaps shut!
            if (typeof gsap !== 'undefined') {
                const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

                // Step 1: Fly in key from right side to keyhole
                tl.fromTo(keyEl,
                    { x: 100, y: -20, opacity: 0, rotate: -45, scale: 1.4 },
                    { x: 0, y: 0, opacity: 1, rotate: 0, scale: 1, duration: 0.9, delay: 0.3 }
                );

                // Step 2: Turn key 90 degrees inside keyhole
                tl.to(keyEl, {
                    rotate: 90,
                    duration: 0.5,
                    ease: 'back.out(2)'
                }, '+=0.2');

                // Step 3: Keyhole glows bright red/gold, Key fades into slot
                tl.to(keyEl, {
                    scale: 0.5,
                    opacity: 0,
                    duration: 0.35
                }, '+=0.1');

                // Step 4: Slam Padlock Shackle Down to LOCKED position!
                tl.call(() => {
                    lockStage.classList.add('is-locked');
                    if (keyholeSlot) keyholeSlot.setAttribute('fill', '#EF4444');
                });

                // Step 5: Card slight impact bounce when locked
                tl.to('#locked-card-box', {
                    y: 6,
                    scale: 0.995,
                    duration: 0.1,
                    yoyo: true,
                    repeat: 1,
                    ease: 'power2.inOut'
                });
            } else {
                // Fallback without GSAP
                setTimeout(() => {
                    lockStage.classList.add('is-locked');
                }, 800);
            }
        });
    </script>
</body>

</html>
